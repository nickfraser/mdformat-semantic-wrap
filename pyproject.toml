[build-system]
requires = ["hatchling>=1.27,<2", "hatch-vcs>=0.5,<1"]
build-backend = "hatchling.build"

[project]
name = "mdformat-semantic-wrap"
dynamic = ["version"]
description = "Soft-target semantic wrapping for mdformat, powered by mdformat-slw"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mdformat>=1.0,<2",
  "mdformat-slw==0.4.0",
  "wcwidth>=0.2.13,<1",
]

[project.entry-points."mdformat.parser_extension"]
semantic_wrap = "mdformat_semantic_wrap"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "mdformat-gfm>=1,<2",
  "hatchling>=1.27,<2",
  "hatch-vcs>=0.5,<1",
]
dev = ["mdformat-semantic-wrap[test]", "pre-commit>=4.4,<5"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.hatch.build.targets.wheel]
packages = ["src/mdformat_semantic_wrap"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
  "/.mdformat.toml",
  "/.pre-commit-config.yaml",
  "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".ocs/pytest-cache"
